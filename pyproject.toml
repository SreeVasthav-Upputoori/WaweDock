[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavedock"
version = "0.1.0"
description = "Open-source molecular modelling and docking workbench"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sree Vasthav Upputoori" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7",
    "gemmi",
    "numpy",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
docking = ["rdkit", "meeko>=0.7", "pdb2pqr", "propka", "prolif"]
dev = ["pytest>=8.2", "pyinstaller", "pillow"]
repair = ["pdbfixer==1.12.0", "openmm>=8.2,<9", "biopython>=1.85,<2"]
# Open Babel is GPL-2.0. It is the bond-perception backend for the "Interactions (ProLIF)"
# feature (mds/chem/interactions.py) and is kept OPTIONAL and separately installed, never
# bundled into the distributed .exe (excluded in wavedock.spec), so the distribution is not
# GPL-bound. Without it, interaction analysis reports a clear "not installed" error instead
# of silently failing or being faked.
interactions = ["rdkit", "meeko>=0.7", "prolif", "openbabel-wheel"]
# Scientific stacks are added phase by phase, only once each is tested:
#   Phase 2: viewer backend      Phase 4: gemmi, biopython
#   Phase 5: rdkit, meeko        Phase 8: prolif / plip, pandas

[project.scripts]
wavedock = "mds.app:main"

[tool.setuptools.packages.find]
include = ["mds*"]

[tool.setuptools.package-data]
mds = ["data/**/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
