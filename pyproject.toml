[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavedock"
version = "0.1.0"
description = "Open-source molecular modelling and docking workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7",
    "rdkit",
    "meeko>=0.7",
    "gemmi",
    "pdb2pqr",
    "propka",
    "numpy",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller", "pillow"]
# Scientific stacks are added phase by phase, only once each is tested:
#   Phase 2: viewer backend      Phase 4: gemmi, biopython
#   Phase 5: rdkit, meeko        Phase 8: prolif / plip, pandas

[project.scripts]
wavedock = "mds.app:main"

[tool.setuptools.packages.find]
include = ["mds*"]

[tool.setuptools.package-data]
mds = ["data/**/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
